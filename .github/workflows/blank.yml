
name: Deploy SmartTools PK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SmartTools PK
        run: pnpm --filter @workspace/smarttools-pk build
        env:
          PORT: 8080
          BASE_PATH: /smarttools-pk/


      - name: Build and diagnose website
        run: |
          set -x
          echo "=== Current directory ==="
          pwd
          echo "=== Project files ==="
          ls -la artifacts/smarttools-pk
          echo "=== Build ==="
          pnpm --filter @workspace/smarttools-pk build
          echo "=== Find generated index ==="
          find artifacts/smarttools-pk -name index.html -type f -print
          echo "=== Check expected output ==="
          ls -la artifacts/smarttools-pk/dist/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
