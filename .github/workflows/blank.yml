
name: Deploy SmartTools PK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SmartTools PK
        run: pnpm --filter smarttools-pk build

      - name: Prepare website files
        shell: bash
        run: |
          set -e

          SOURCE=""

          for DIR in \
            artifacts/smarttools-pk/dist/public \
            artifacts/smarttools-pk/dist \
            dist \
            build \
            public
          do
            if [ -f "$DIR/index.html" ]; then
              SOURCE="$DIR"
              break
            fi
          done

          if [ -z "$SOURCE" ]; then
            FILE=$(find . \
              -type f \
              -name index.html \
              -not -path './node_modules/*' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path '*/src/*' \
              -print -quit)

            if [ -z "$FILE" ]; then
              echo "ERROR: Built index.html not found."
              exit 1
            fi

            SOURCE=$(dirname "$FILE")
          fi

          mkdir -p _site
          cp -RL "$SOURCE"/. _site/
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
